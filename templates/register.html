{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
    <div class="auth-form">
        <form method="post">
            <div class="auth-header">
                <h2>📝 Создание аккаунта</h2>
                <p>Зарегистрируйтесь, чтобы начать вести дневник</p>
            </div>

            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" name="username" id="username" placeholder="Введите имя пользователя..." required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" name="password" id="password" placeholder="Введите пароль..." required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Подтверждение пароля</label>
                <input type="password" name="password_confirm" id="password_confirm" placeholder="Повторите пароль..." required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Зарегистрироваться</button>

            <div class="auth-switch">
                Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
            </div>
        </form>
    </div>
{% endblock %}
